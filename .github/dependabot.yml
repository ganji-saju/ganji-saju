# 2026-08-30 — 의존성 업데이트 자동화.
#   저장소가 PUBLIC 이라 취약한 버전이 그대로 보인다. 주 1회 PR 로 올라온다.
#   ⚠️ 여기서 켜지는 건 **버전 업데이트**다. "Dependabot security updates"(취약점 자동 PR)는
#      저장소 설정의 별도 토글이라 GitHub 웹에서 한 번 켜야 한다(현재 disabled).
version: 2
updates:
  - package-ecosystem: npm
    directory: /
    schedule:
      interval: weekly
      day: monday
      time: '09:00'
      timezone: Asia/Seoul
    open-pull-requests-limit: 5
    # 한 번에 우르르 올라오면 아무도 안 본다. 패치는 묶고, major 는 사람이 판단한다.
    groups:
      patch-and-minor:
        update-types: ['patch', 'minor']
    ignore:
      - dependency-name: '*'
        update-types: ['version-update:semver-major']
    commit-message:
      prefix: 'chore(deps)'

  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: monthly
    # 2026-08-31 — npm 쪽에만 major 무시를 걸어 두었더니 actions 가 4 → 7 처럼 두 단계
    #   이상 뛰는 PR 을 올렸다(checkout·setup-node·upload-artifact). 액션 major 는
    #   **CI 자체의 동작**을 바꾸고, 실패 경로(예: upload-artifact)는 초록 CI 로도
    #   검증되지 않는다 — 사람이 릴리스 노트를 보고 결정할 일이다.
    ignore:
      - dependency-name: '*'
        update-types: ['version-update:semver-major']
    commit-message:
      prefix: 'chore(ci)'
