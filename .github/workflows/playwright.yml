name: Playwright E2E

on:
  pull_request:
  push:
    branches:
      - main

concurrency:
  group: playwright-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  e2e:
    name: Playwright smoke E2E (Phase 2A 인증 X)
    runs-on: ubuntu-latest
    # 2026-08-31 — Dependabot PR 에서는 건너뛴다.
    #   GitHub 은 Dependabot PR 에 **일반 Actions 시크릿을 주지 않는다**(전용 스코프가 따로 있다).
    #   그래서 NEXT_PUBLIC_SUPABASE_* 가 빈 값이 되고 앱이 "Your project's URL and Key are
    #   required to create a Supabase client!" 로 죽어 **의존성과 무관하게 항상 빨갛다**.
    #   ⚠️ Dependabot 스코프에 키를 복사하는 방법도 있지만, 이 저장소는 PUBLIC 이라
    #      Dependabot PR 이 실행하는 코드에 실제 키를 노출하게 되므로 택하지 않았다.
    #   의존성 PR 검증은 Test/Typecheck/Build + CodeQL 이 맡고, E2E 는 main 머지 후 확인한다.
    if: github.actor != 'dependabot[bot]'
    timeout-minutes: 20
    env:
      CI: true
      NEXT_TELEMETRY_DISABLED: 1
      # Phase 2A (smoke.spec.ts) — 인증 필요 없는 public 페이지.
      # Phase 2B (saju.spec.ts) — 인증 fixture 가 E2E_TEST_USER_EMAIL/PASSWORD 로
      # 로그인 후 storage state 재사용. credentials 미설정 시 자동 skip.
      NEXT_PUBLIC_SUPABASE_URL: ${{ secrets.NEXT_PUBLIC_SUPABASE_URL }}
      NEXT_PUBLIC_SUPABASE_ANON_KEY: ${{ secrets.NEXT_PUBLIC_SUPABASE_ANON_KEY }}
      # 2026-08-11 전면 유료화 잠금(src/lib/paywall-lockdown.ts)은 프로덕션 기본 ON 이다.
      #   E2E 는 잠금 OFF 로 돌린다 — 무료 흐름(오늘운세·타로·띠운세…) 회귀 감시망을
      #   잠금 기간에도 살려두어야 되돌릴 때 안전하다. 잠금 자체는 spec 으로 검증한다.
      #   ⚠️ NEXT_PUBLIC_* 는 빌드 타임 인라인이라 build 스텝에 반드시 걸려 있어야 한다.
      NEXT_PUBLIC_PAYWALL_LOCKDOWN: 'false'
      E2E_TEST_USER_EMAIL: ${{ secrets.E2E_TEST_USER_EMAIL }}
      E2E_TEST_USER_PASSWORD: ${{ secrets.E2E_TEST_USER_PASSWORD }}
      E2E_TEST_READING_SLUG: ${{ secrets.E2E_TEST_READING_SLUG }}
      # Phase 2C — payment-blocks spec 이 entitlement seed/cleanup 위해 사용.
      # dev/staging project 의 service_role 만 허용. production 절대 금지.
      SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          # Node 22 — Supabase admin client 의 @supabase/supabase-js@^2.103.1 이
          # Node 20 에선 native WebSocket 부재로 실패 ("Node.js 20 detected without
          # native WebSocket support"). Node 22+ 에서 native 지원으로 해결.
          # ci.yml 은 build 검증용이라 Vercel 호환 (20.x) 유지.
          node-version: 22
          cache: npm

      - name: Install dependencies
        # --legacy-peer-deps: @tosspayments/payment-widget-sdk peer (typescript 4.x) vs package.json (typescript ^5) 충돌 우회
        run: npm ci --legacy-peer-deps --engine-strict

      - name: Install Playwright browsers (chromium only)
        run: npx playwright install --with-deps chromium

      # 프로덕션 빌드로 E2E 검증 — 개발 모드 전용 React/Next dev 경고(App Router
      # template keyless-array 등)가 smoke 의 'console error 0' 단언을 flaky 하게
      # 깨는 문제 제거 + 실제 사용자가 받는 빌드를 테스트. playwright.config 의
      # webServer 가 CI 에서 'npm run start'(next start)로 이 .next 출력을 띄운다.
      - name: Build (production)
        run: npm run build

      - name: Run Playwright E2E
        run: npm run e2e

      - name: Upload Playwright report (on failure)
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-report
          path: playwright-report/
          retention-days: 14
